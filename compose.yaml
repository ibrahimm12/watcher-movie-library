services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-movies}
      POSTGRES_USER: ${DB_USER:-movies}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting the stack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - movie-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    image: movie-api:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${DB_NAME:-movies}}
      DB_USER: ${DB_USER:-movies}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting the stack}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  movie-data: