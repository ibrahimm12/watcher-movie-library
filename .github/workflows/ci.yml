name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-smoke:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: movies_ci_only_password
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build and start application stack
        run: docker compose up --build --detach --wait

      - name: Smoke test API and database persistence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet "Screenroom"
          curl --fail --silent --show-error http://localhost:8080/health/live
          curl --fail --silent --show-error http://localhost:8080/health/ready
          curl --fail --silent --show-error http://localhost:8080/api/movies | jq --exit-status 'length > 0'
          migration_version="$(docker compose exec -T postgres psql -U movies -d movies -Atc "SELECT version FROM flyway_schema_history WHERE version = '1' AND success")"
          test "$migration_version" = "1"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"name":"devops-ci-smoke","year":2026}' \
            http://localhost:8080/api/movies
          docker compose restart api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            'http://localhost:8080/api/movies?q=devops-ci-smoke' \
            | jq --exit-status 'length == 1'

      - name: Verify upgrade from the pre-Flyway schema
        shell: bash
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait postgres
          docker compose exec -T postgres psql -U movies -d movies -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE movies (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, data JSONB NOT NULL CHECK (jsonb_typeof(data) = 'object')); INSERT INTO movies (data) VALUES (jsonb_build_object('name', 'legacy-movie', 'year', 2024));"
          docker compose up --build --detach --wait api
          curl --fail --silent --show-error http://localhost:8080/api/movies \
            | jq --exit-status 'length == 1 and .[0].name == "legacy-movie"'
          baseline="$(docker compose exec -T postgres psql -U movies -d movies -Atc "SELECT type || ':' || version FROM flyway_schema_history WHERE success ORDER BY installed_rank DESC LIMIT 1")"
          test "$baseline" = "BASELINE:1"

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans